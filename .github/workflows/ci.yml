name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile every module
        run: |
          python -m py_compile \
            "My Chatbot.py" app.py app_paths.py \
            memory_system.py rag_system.py agent_tools.py generation.py \
            ui_theme.py ui_widgets.py ui_dialogs.py
          echo "Python syntax check passed"

  javascript:
    name: Android UI syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the web client
        run: |
          node --check android-app/www/app.js
          echo "JavaScript syntax check passed"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed API keys or keystores
        run: |
          if git ls-files | grep -Eq '\.(jks|keystore|p12|pfx)$'; then
            echo "::error::A keystore is committed to the repository."
            exit 1
          fi
          if git grep -nE 'gsk_[A-Za-z0-9_-]{20,}' -- . ':!*.md' ':!*.example' ':!*.exe' ':!*.apk' ':!*.png' ':!*.jpg'; then
            echo "::error::A Groq API key appears to be committed."
            exit 1
          fi
          echo "No committed secrets found"
